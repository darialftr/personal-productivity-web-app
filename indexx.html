<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f4ee">
  <title>Itera — SPA prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="spa/app.css">
</head>
<body>
  <div class="spa-shell">
    <div class="sidebar-overlay" id="sidebarOverlay" hidden></div>
    <header class="mobile-topbar"><button class="icon-button" id="openSidebar" aria-label="Deschide navigația">☰</button><span class="mobile-brand">Itera</span></header>
    <aside class="sidebar" id="sidebar" aria-label="Navigație principală">
      <a class="brand" href="#/" aria-label="Itera acasă"><span class="brand-mark">i</span><span><strong>Itera</strong><small>study beautifully</small></span></a>
      <nav class="sidebar-nav" id="sidebarNav">
        <a data-route="/" href="#/">⌂ <span>Acasă</span></a><a data-route="/schedule" href="#/schedule">▦ <span>Orar</span></a><a data-route="/calendar" href="#/calendar">□ <span>Calendar</span></a><a data-route="/tasks" href="#/tasks">✓ <span>Task-uri</span></a><a data-route="/subjects" href="#/subjects">◇ <span>Materii</span></a><a data-route="/grades" href="#/grades">☆ <span>Note</span></a><a data-route="/admission" href="#/admission">⌁ <span>Admitere</span></a>
      </nav>
      <div class="profile-card"><span class="avatar" id="profileAvatar">I</span><span><strong id="profileName">Itera</strong><small id="profileGrade">Se încarcă…</small></span><button class="logout-button" id="logoutButton" aria-label="Deconectare">↗</button></div>
    </aside>
    <main class="main-content"><header class="page-header"><div><p class="eyebrow" id="pageEyebrow">Astăzi</p><h1 id="pageTitle">Bun venit înapoi.</h1><p id="pageSubtitle">Spațiul tău pentru un progres liniștit.</p></div><button class="primary-button" id="quickAddButton">＋ Adaugă</button></header><div id="appNotice" class="app-notice" hidden></div><div class="view-container" id="viewContainer" aria-live="polite"></div></main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script type="module" src="spa/app.js"></script>
</body></html>
